<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Impressoras</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mut:#6b7280;--bd:#e3e6eb;--ac:#2563eb;--ok:#15803d;--okb:#dcfce7;--wa:#b45309;--wab:#fef3c7;--er:#b91c1c;--erb:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1b1f27;--tx:#e8eaee;--mut:#9aa3b2;--bd:#2d333f;--ac:#60a5fa;--ok:#4ade80;--okb:#143323;--wa:#fbbf24;--wab:#3a2c0b;--er:#f87171;--erb:#3d1618}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1b1f27;--tx:#e8eaee;--mut:#9aa3b2;--bd:#2d333f;--ac:#60a5fa;--ok:#4ade80;--okb:#143323;--wa:#fbbf24;--wab:#3a2c0b;--er:#f87171;--erb:#3d1618}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
.bar input{flex:1 1 200px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.d{color:var(--er)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.top b{font-size:16px}
.set{color:var(--mut);font-size:13px;margin-top:2px}.mk{background:var(--bd);color:var(--tx);font-weight:600;font-size:11px;padding:1px 7px;border-radius:6px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:10px 0;font-size:13px}
.meta span:nth-child(odd){color:var(--mut)}
.meta span:nth-child(even){font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
a.ip{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:13px;white-space:nowrap}
.sup{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.sup .n{flex:1}
.sup small{display:block;color:var(--mut)}
.q{display:flex;align-items:center;gap:6px}
.q button{padding:2px 10px;font-size:18px;line-height:1.2}
.q b{min-width:26px;text-align:center;font-size:16px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.lv{height:7px;border-radius:4px;background:var(--bd);margin-top:5px;overflow:hidden;width:150px;max-width:100%}.lv i{display:block;height:100%}
.lr{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}.lr .lv{margin-top:0;width:110px}.fo{font-size:11px}.cn{font-size:12px;min-width:50px}
.rd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin:0 0 6px}
.nn{background:var(--bd);color:var(--mut)}.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.er{background:var(--erb);color:var(--er)}
.act{display:flex;gap:8px;margin-top:8px}
textarea{width:100%;height:320px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;resize:vertical}
.empty{text-align:center;color:var(--mut);padding:40px 0}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(460px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.f .w{grid-column:1/-1}
.f input{width:100%}
</style>
</head>
<body>
<main>
<h1>🖨️ Controle de Impressoras - FAMETRO </h1>
<p class="sub">Cadastro, nível de toner e cilindro e acesso direto ao painel web de cada impressora.</p>
<div class="chips" id="chips"></div>
<div class="bar">
<input id="q" placeholder="Buscar">
<select id="fl"><option value="">Todas as unidades</option></select><select id="fs"><option value="">Todos os setores</option></select>
<select id="fst"><option value="">Todos os status</option><option value="nosc">Scanner com problema</option><option value="off">Impressoras offline</option><option value="lvl">Nível instalado ≤ 15%</option><option value="lvl20">Nível instalado ≤ 20%</option></select>
<button class="p" id="add">+ Impressora</button>
<button id="colh" style="display:none" title="Lê agora as impressoras via SNMP">🔄 Coletar agora</button><button id="rel" title="Texto pronto para colar no WhatsApp, seguindo o filtro atual">📋 Relatório</button><button id="exp">Exportar</button>
<button id="imp" title="Backup do sistema, leitura.json do coletor ou CSV do NDD">Importar</button>
<input type="file" id="file" accept=".json,.csv" hidden>
</div>
<div class="grid" id="grid"></div>
</main>

<dialog id="dlg">
<h3 id="dt" style="margin-top:0">Impressora</h3>
<div class="f">
<label>Setor<input id="f_setor"></label>
<label>Local / Unidade<input id="f_local"></label><label>Marca<input id="f_marca" placeholder="HP, OKI, Brother..."></label><label class="w">Modelo<input id="f_modelo"></label>
<label>Endereço IP<input id="f_ip" placeholder="192.168.0.10"></label>
<label>Endereço MAC<input id="f_mac" placeholder="AA:BB:CC:DD:EE:FF"></label>
<label>Número de série<input id="f_serie"></label><label>Scanner OK?<select id="f_scanner"><option value="">—</option><option value="sim">sim</option><option value="não">não</option></select></label>
</div>
<div class="act" style="justify-content:flex-end;margin-top:14px">
<button id="cancel">Cancelar</button><button class="p" id="save">Salvar</button>
</div>
</dialog>

<dialog id="rdlg">
<h3 style="margin:0 0 4px">Relatório para o WhatsApp</h3>
<p class="sub" style="margin:0 0 10px">Segue os filtros que estão ativos na tela. Você pode editar o texto antes de copiar.</p>
<textarea id="rtxt"></textarea>
<div class="act" style="justify-content:flex-end;margin-top:12px"><button id="rclose">Fechar</button><a class="ip" id="rwa" target="_blank" rel="noopener" style="padding:8px 12px">Abrir no WhatsApp ↗</a><button class="p" id="rcopy">Copiar</button></div>
</dialog>

 if(ix["Current Supply"]==null||ix["IP"]==null){alert("Arquivo inválido");return}
 const g=(r,n)=>(r[ix[n]]||"").trim(),by={};
 rows.forEach(r=>{const ip=g(r,"IP");if(!ip)return;(by[ip]=by[ip]||{ip,r0:r,s:[]}).s.push(r)});
 let ok=0;const novos=[],tocados=new Set();
 Object.values(by).forEach(({ip,r0,s})=>{
  const sup=s.map(r=>{const ty=g(r,"Type"),lv=parseInt(g(r,"Current Level")),d=parseInt(g(r,"Remaining days"));
   const tipo=/drum/i.test(ty)?"cilindro":/toner|ink/i.test(ty)?"toner":null;if(!tipo)return null;
   return{nome:g(r,"Current Supply"),tipo,cor:g(r,"Color"),pct:isNaN(lv)||lv<0?null:lv,previsao:g(r,"Finishing Prediction"),dias:isNaN(d)?null:d}}).filter(Boolean);
  const n={fonte:"NDD",lido_em:s.map(r=>pdt(g(r,"Last Reading"))).sort().pop(),suprimentos:sup};
  const serie=g(r0,"Printer Serial Number").toUpperCase();
  const m=data.filter(p=>(p.ip||"").trim()===ip||(serie&&(p.serie||"").trim().toUpperCase()===serie));
  if(m.length){m.forEach(p=>{p.ndd=n;tocados.add(p)});ok++}else novos.push({ip,serie:g(r0,"Printer Serial Number"),setor:g(r0,"Printer Name"),local:g(r0,"Site"),modelo:g(r0,"Model"),marca:g(r0,"Manufacturer"),n})});
 const lidoMax=rows.map(r=>pdt(g(r,"Last Reading"))).sort().pop()||"";let saiu=0;
 data.forEach(p=>{if(p.ndd&&!tocados.has(p)&&(p.ndd.suprimentos||[]).length){p.ndd={fonte:"NDD",lido_em:lidoMax,suprimentos:[]};saiu++}});
 let add=0;
 if(novos.length&&confirm(novos.length+" impressoras do NDD não estão cadastradas.\nAdicionar ao sistema?")){novos.forEach(x=>{data.push({id:"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),setor:x.setor,local:x.local,marca:x.marca,modelo:x.modelo,ip:x.ip,mac:"",serie:x.serie,scanner:"",ndd:x.n});add++})}
 persist();render();alert((saiu?saiu+" impressoras saíram da lista de alertas do NDD (suprimento reposto).\n":"")+ok+" impressoras atualizadas com dados do NDD"+(add?"; "+add+" novas adicionadas.":novos.length?"; "+novos.length+" não cadastradas foram ignoradas.":"."))}
function nivel(p){const v=[lvl(p,"toner"),lvl(p,"cil")].filter(x=>x!=null);return v.length?Math.min(...v):null}
function emo(v){return v==null?"⚪":v<=5?"🔴":v<=10?"🟠":v<=20?"🟡":"🟢"}
function txs(p,k){const its=sups(p,k).filter(i=>i.pct!=null);if(!its.length)return"—";return its.map(i=>(cor(i)&&(k==="toner"||its.length>1)?cor(i).toLowerCase()+" ":"")+i.pct+"%").join(" / ")}
function tcase(s){const lo=["DE","DA","DO","DAS","DOS","E"];if(!s||s!==s.toUpperCase())return s||"";return s.split(/\s+/).map(w=>lo.includes(w)?w.toLowerCase():/\d/.test(w)||["RH","TI","EAD","ZL","CPD","NADI"].includes(w)?w:w[0]+w.slice(1).toLowerCase()).join(" ")}
function lido(p){return (p.ndd&&p.ndd.lido_em)||(p.leitura&&p.leitura.lido_em)||""}
function velha(p){const l=lido(p);return !!l&&(Date.now()-new Date(l))>36*36e5}
function linha(p,mk){
  const tn=txs(p,"toner"),cl=txs(p,"cil"),ps=[];
  if(tn!=="—")ps.push("Toner "+tn);if(cl!=="—")ps.push("Cilindro "+cl);
  const its=[...sups(p,"toner"),...sups(p,"cil")].filter(i=>i.pct!=null).sort((a,b)=>a.pct-b.pct);
  const m=its[0]&&its[0].previsao&&its[0].previsao.match(/^(\d{2}\/\d{2})\/\d{4}$/);
  const vel=mk&&velha(p);
  return "• *"+tcase(p.setor||"Sem setor")+"*"+(p.local?" ("+p.local+")":"")+": "+(ps.join(" · ")||"sem leitura")+(m?" ⏳ "+m[1]:"")+(vel?" ⚠️ leitura antiga":"")}
function relatorio(){
  const L=[...curList].filter(p=>nivel(p)!=null).sort((a,b)=>nivel(a)-nivel(b));
  const fe=$("fst"),f=[];
  if(fe.value&&fe.options)f.push(fe.options[fe.selectedIndex].text);
  if($("fl").value)f.push($("fl").value==="__SEDE__"?"SEDE":$("fl").value);if($("fs").value)f.push($("fs").value);if($("q").value)f.push('busca "'+$("q").value+'"');
  const ds=L.map(lido).filter(Boolean).sort(),tv=L.filter(velha).length,todas=tv>0&&tv===L.filter(p=>lido(p)).length;
  let t="📋 *RELATÓRIO DE SUPRIMENTOS*\n"+(ds.length?"🗓️ Leitura: "+dt(ds[ds.length-1]):"🗓️ Emitido em "+new Date().toLocaleDateString("pt-BR"))+"\n🔎 Filtro: "+(f.join(" · ")||"todas as impressoras")+"\n"+(todas?"⚠️ Leituras com mais de 36 h. Reimporte o NDD para atualizar.\n":"");
  const fx=[["🔴","CRÍTICO (até 5%)",v=>v<=5],["🟠","ALTO (6 a 10%)",v=>v>5&&v<=10],["🟡","ATENÇÃO (11 a 20%)",v=>v>10&&v<=20],["🟢","OK (acima de 20%)",v=>v>20]],cont=[];
  fx.forEach(([e,nm,fn])=>{const g=L.filter(p=>{const v=nivel(p);return v!=null&&fn(v)});cont.push(g.length);if(g.length)t+="\n"+e+" *"+nm+"* — "+g.length+"\n"+g.map(p=>linha(p,!todas)).join("\n")+"\n"});
  t+="\n📦 *RESUMO:* "+L.length+" impressoras · 🔴 "+cont[0]+" · 🟠 "+cont[1]+" · 🟡 "+cont[2]+(cont[3]?" · 🟢 "+cont[3]:"");
  return t}
$("rel").onclick=()=>{const t=relatorio();$("rtxt").value=t;const w=$("rwa");
  if(t.length<3500){w.href="https://wa.me/?text="+encodeURIComponent(t);w.style.display=""}else w.style.display="none";
  $("rdlg").showModal()};
$("colh").onclick=async()=>{
  for(let t=0;t<2;t++){
    const r=await fetch("/api/coletar",{method:"POST",headers:{"X-Senha":PW}});
    if(r.status===401&&AUTHON){location.reload();return}if(r.status===403){alert("Seu usuário tem acesso somente de leitura.");return}
    if(r.status===401){const s=prompt("Senha de edição:");if(s===null)return;PW=s;try{sessionStorage.setItem("pw",s)}catch(e){}continue}
    alert(r.ok?"Coleta iniciada. Em cerca de 1 minuto os níveis aparecem atualizados.":"Não foi possível iniciar a coleta.");return}};
$("chips").onclick=e=>{if(e.target.id==="sair"){e.preventDefault();fetch("/api/logout",{method:"POST"}).finally(()=>location.reload())}};
$("rclose").onclick=()=>$("rdlg").close();
$("rcopy").onclick=async()=>{const t=$("rtxt"),b=$("rcopy");try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand("copy")}b.textContent="Copiado ✓";setTimeout(()=>b.textContent="Copiar",1500)};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const t=r.result.replace(/^\uFEFF/,"");if(/^\s*[\[{]/.test(t))impJson(t);else impCsv(t)};r.readAsText(f);e.target.value="";
};
if(migrar())persist();
render();
initServer().then(ok=>{if(!ok)initShared()});
</script>
